    <meta charset="UTF-8" />
    <!-- Icons are the Travio Ghana badge, byte-identical to the one the
         storefront serves (TravioGhana-Store public/icons/v2). The /icons/v2/
         paths are versioned because browsers key their icon caches on the icon
         URL rather than on Cache-Control, so a path that has never been
         requested can't be served from a stale entry. These replace the old
         "TA" monogram favicon.svg, whose 32x32 and apple-touch links pointed at
         files that were never in public/ and 404'd. A copy of the .ico also sits
         at the root path, which is what browsers request unprompted. -->
    <link rel="icon" sizes="any" href="/icons/v2/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/v2/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/v2/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/v2/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/v2/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/v2/apple-touch-icon.png" />
